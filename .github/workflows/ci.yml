name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    env:
      # Test database provided by the pgvector service below. The database
      # name contains "test" so the harness accepts it as a test database.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/assessment_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/assessment_test
      SESSION_SECRET: ci-only-not-a-real-secret
      # Deterministic, offline provider so CI never needs an API key.
      LLM_PROVIDER: mock
    services:
      postgres:
        # Official pgvector image. The test database is provisioned from
        # prisma/schema.prisma and needs the `vector` extension + HNSW index,
        # so plain Postgres is not enough.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: assessment_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d assessment_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      # `npm test` provisions the test database from prisma/schema.prisma
      # (pgvector extension + HNSW index included) in its global setup, then
      # runs the Vitest suite against it.
      - name: Provision test database and run tests
        run: npm test

      - name: Build
        run: npm run build
